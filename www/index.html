function adm(){modal(`<h3>إدارة الأعضاء</h3>${ac().map(m=>`<div class=row>${av(m,30)}<div class=gr1>${esc(m.name)}</div>${m.id!=ME.id?`<button class=tag style="border:0" data-a=code data-id=${m.id}>🔑</button><button class=tag style="border:0" data-a=del data-id=${m.id}>🗑</button>`:''}</div>`).join('')}<button class=btn data-a=add>+ إضافة عضو</button>`)}
const inv=async b=>{const{data,error}=await sb.functions.invoke('admin-members',{body:b});if(error||!data||data.error){toast((data&&data.error)||'فشلت العملية');return null}return data};
async function Ac(a,d){const t=ld(),dd=D(t),n=ME?ME.name:'',ask=m=>confirm(m);
if(a=='login'){const c=fmt($('#cd').value);if(!/^[A-Za-z0-9]{6,20}$/.test(c))return toast('الرمز حروف إنجليزية وأرقام (6 إلى 20)');const{data,error}=await sb.auth.signInWithPassword({email:c+'@shilla.app',password:c});if(error)return toast('رمز غير صحيح');U=data.user;return load()}
if(a=='send'){const i=$('#i'),v=i.value.trim();S.msgs.push({id:nid(),from:ME.id,text:v||'👍',big:!v,t:Date.now(),re:{},rd:{[ME.id]:1}});i.value='';save();sb.functions.invoke('send-push',{body:{title:n,body:v||'👍',from:U.id}}).catch(()=>0)}
if(a=='re'){const m=S.msgs.find(x=>x.id==d.id);if(m.re[ME.id]==d.e)delete m.re[ME.id];else m.re[ME.id]=d.e;M.innerHTML='';save()}
if(a=='ok'&&ask('تأكيد التكسيدة اليوم؟')){dd.s='ok';dd.host=ME.id;dd.att[ME.id]=1;sys(`${n} أكّد التكسيدة اليوم 🎉`);save()}
if(a=='pass'&&ask('تمرّر الدور؟')){if(dd.pass.length>=1){pass(dd,ME.id);dd.s='none';sys(`${n} مرّر أيضاً، اليوم مافيش تكسيده`)}else{pass(dd,ME.id);sys(`${n} مرّر الدور: شوفو اللي بعدي`)}save()}
if(a=='cant'&&ask('مايسيرش منك اليوم؟')){cancel(dd,ME.id);sys(`${n}: مايسيرش مني اليوم، التكسيدة ملغاة. مين يديرها؟`);save()}
if(a=='vol'&&ask('تدير التكسيدة اليوم؟')){dd.s='ok';dd.host=ME.id;dd.att[ME.id]=1;sys(`${n} تطوّع لإدارة التكسيدة اليوم 👏`);save()}
if(a=='end'&&ask('انتهى اللقاء؟')){dd.s='done';dd.rolled=1;rot(dd.host);sys('انتهى لقاء اليوم، الدور يتحرّك للتالي');save()}
if(a=='att'){dd.att[ME.id]=+d.v;save()}
if(a=='addp')modal(`<h3>سجّل ${d.ty=='f'?'فترشة':'لحقة'}</h3><select id=w>${ac().map(m=>`<option value=${m.id}>${esc(m.name)}</option>`).join('')}</select><textarea id=x maxlength=80 rows=3 placeholder="اكتب الموقف (80 حرفاً)" style="margin-top:8px"></textarea><button class=btn data-a=padd data-ty=${d.ty}>تسجيل</button>`);
if(a=='padd'){const x=$('#x').value.trim(),w=$('#w').value;if(!x)return;const p={id:nid(),ty:d.ty,who:w,by:ME.id,text:x,t:Date.now(),d:t};S.fts.push(p);sys(`${n} سجّل ${d.ty=='f'?'فترشة':'لحقة'} على ${mem(w).name} 😂`);M.innerHTML='';save()}
if(a=='vote'){const k=d.ty+wk(Date.now());S.votes[k]=S.votes[k]||{};if(S.votes[k][ME.id]==d.id)delete S.votes[k][ME.id];else S.votes[k][ME.id]=d.id;save()}
if(a=='all'){st.all=1;R()}if(a=='pp'){st.pp=st.pp==d.id?null:d.id;R()}if(a=='x')M.innerHTML='';
if(a=='mb')modal(`<h3>الأعضاء</h3>${[...ac()].sort((x,y)=>ON.includes(y.id)-ON.includes(x.id)).map(m=>`<div class=row>${av(m,30)}<div class=gr1>${esc(m.name)}</div><small class=m>${ON.includes(m.id)?'🟢 متصل':'غير متصل'}</small></div>`).join('')}`);
if(a=='out'){await sb.auth.signOut();U=ME=null;if(window.ch)sb.removeChannel(ch);R()}
if(a=='pic'){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);ME.av=c.toDataURL('image/jpeg',.7);save()};im.src=URL.createObjectURL(f.files[0])};f.click()}
if(a=='push'){const p=await Notification.requestPermission();if(p!='granted')return toast('لم يتم السماح بالإشعارات');if(VAPID)try{const r=await navigator.serviceWorker.ready,k=Uint8Array.from(atob(VAPID.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)),s=await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:k});await sb.from('push_subs').upsert({uid:U.id,sub:s})}catch(e){}toast('تم تفعيل الإشعارات ✅')}
if(a=='adm')adm();
if(a=='add'){const nm=prompt('اسم العضو'),c=fmt(prompt('الرمز (6-20 حرفاً إنجليزياً/رقماً)')||'');if(!nm||!/^[A-Za-z0-9]{6,20}$/.test(c))return toast('بيانات غير صحيحة');const r=await inv({a:'add',code:c,name:nm});if(!r)return;const m={id:nid(),name:nm,uid:r.uid};S.members.push(m);S.queue.push(m.id);sys(`انضم ${nm} للشلّة 🎉`);save();adm()}
if(a=='code'){const c=fmt(prompt('الرمز الجديد')||'');if(!/^[A-Za-z0-9]{6,20}$/.test(c))return;if(await inv({a:'code',uid:mem(d.id).uid,code:c}))toast('تم تغيير الرمز')}
if(a=='del'&&ask('حذف هذا العضو؟')){const m=mem(d.id);if(await inv({a:'del',uid:m.uid})){m.del=1;S.queue=S.queue.filter(x=>x!=m.id);save();adm()}}}
document.onclick=e=>{const x=e.target.closest('[data-t],[data-a]');if(!x)return;const{t,a}=x.dataset;if(t){tab=t;st={};M.innerHTML='';R()}else Ac(a,x.dataset)};
document.onkeydown=e=>{if(e.key=='Enter'&&e.target.id=='i')Ac('send')};document.oninput=e=>{if(e.target.id=='i')$('#sb').textContent=e.target.value.trim()?'➤':'👍'};
const rp=id=>modal(`<div class=em>${E.map(e=>`<span data-a=re data-id=${id} data-e=${e}>${e}</span>`).join('')}</div>`);let lp;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.b');if(b)lp=setTimeout(()=>rp(b.dataset.id),450)});['pointerup','pointermove','pointercancel'].forEach(v=>document.addEventListener(v,()=>clearTimeout(lp)));
document.ondblclick=e=>{const b=e.target.closest('.b');if(b)rp(b.dataset.id)};document.oncontextmenu=e=>{const b=e.target.closest('.b');if(b){e.preventDefault();rp(b.dataset.id)}};
function connect(){if(window.ch)return;window.ch=sb.channel('room',{config:{presence:{key:ME.id}}});ch.on('presence',{event:'sync'},()=>{ON=Object.keys(ch.presenceState());R()}).subscribe(s=>{if(s=='SUBSCRIBED')ch.track({t:1})});
sb.channel('db').on('postgres_changes',{event:'*',schema:'public',table:'app_state'},p=>{const n=p.new&&p.new.data;if(!n)return;const c=S.msgs.length;S=mrg(S,n);put();const l=S.msgs.slice(c).filter(m=>!m.sys&&m.from!=ME.id).pop();if(l&&(tab!='chat'||document.hidden)){toast(mem(l.from).name+': '+l.text);if(document.hidden&&Notification.permission=='granted')navigator.serviceWorker.ready.then(r=>r.showNotification(mem(l.from).name,{body:l.text,vibrate:[200,100,200]}))}R()}).subscribe()}
async function load(){await sync();ME=ac().find(m=>m.uid==U.id);if(!ME){toast('هذا الرمز غير مفعّل، تواصل مع المضيف');await sb.auth.signOut();U=null;return R()}roll();connect();R();sync()}
addEventListener('online',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME){roll();sync();R()}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
sb.auth.getSession().then(({data})=>{if(data.session){U=data.session.user;load()}else R()});
</script></body></html>
