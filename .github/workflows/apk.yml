name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: https://marteen-fi-nas.pages.dev

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Point the app at the Cloudflare site
        run: |
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));c.server={url:process.env.SITE_URL,cleartext:false};fs.writeFileSync(f,JSON.stringify(c,null,2))"
          cat capacitor.config.json

      - name: Use a fixed signing key (so new APKs update over old ones)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore

      - run: npm install
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk marteen-fi-nas.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: النسخة ${{ github.run_number }}
          generate_release_notes: true
          files: marteen-fi-nas.apk
        
